<!-- @dsCard height=300 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:var(--white);}
  .cover{position:relative;width:960px;height:300px;overflow:hidden;background:var(--white);}
  svg{position:absolute;left:0;top:0;}
  .navy{fill:var(--navy);} .blue{fill:var(--blue);} .deep{fill:var(--deep);} .paper{fill:var(--paper);}
  .glyph{fill:var(--blue);font-family:"Anton",Impact,sans-serif;font-size:420px;}
  .rule{stroke:var(--blue);stroke-width:12;fill:none;stroke-linecap:round;}
  .card{rx:var(--radius-card);ry:var(--radius-card);}
  .chip{rx:var(--radius-chip);ry:var(--radius-chip);}
  .name{position:absolute;left:40px;bottom:58px;margin:0;font-family:"Anton",Impact,sans-serif;font-size:100px;line-height:.95;color:var(--navy);letter-spacing:1px;}
  .tag{position:absolute;left:42px;bottom:30px;margin:0;font-family:"Coda",system-ui,sans-serif;font-size:14px;color:var(--muted);max-width:440px;}
</style></head>
<body><div class="cover">
<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg">
  <!-- blocks: navy (tall slab 280×300, bleeds top and bottom), deep (120×180), blue (200×80, radius-chip), paper (160×120, radius-card) -->
  <!-- arrangement: one tall navy slab with satellites, right of x=480, bleeding off top/bottom/right like a Reel frame -->
  <!-- pattern: oversized Anton numeral "01" (chapter tags) clipped by the navy slab + one marker underline in blue — the display face and the felt-pen stroke are what BEN&FIT is remembered by -->
  <!-- scales: space-safe 80, space-card 40, space-block 24; radius-chip 10, radius-card 30 -->
  <defs><clipPath id="slab"><rect x="640" y="-10" width="280" height="320"/></clipPath></defs>
  <rect class="paper card" x="496" y="40" width="160" height="120"/>
  <rect class="navy" x="640" y="-10" width="280" height="320"/>
  <g clip-path="url(#slab)"><text class="glyph" x="600" y="330">01</text></g>
  <rect class="deep" x="920" y="0" width="40" height="300"/>
  <rect class="blue chip" x="520" y="196" width="200" height="64"/>
  <path class="rule" d="M532 278 C 590 270, 660 284, 712 270"/>
</svg>
<p class="name">BEN&amp;FIT</p>
<p class="tag">Les directions artistiques BEN&amp;FIT : humain, pas « IA ».</p>
</div></body></html>
